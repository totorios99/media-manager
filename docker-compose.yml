# STALE - DO NOT `docker compose up` THIS (noted 2026-09-15).
# It mounts only /srv/storage/Movies (no Shows, Staging or .recycle) and points
# the DB at /DATA/AppData/media-manager, while the real service uses
# ~/media-manager/media.db. `restart: unless-stopped` would make that broken
# container look healthy. The service runs from systemd --user instead:
#   ~/.config/systemd/user/media-manager.service
name: media-manager
services:
  media-manager:
    build: .
    image: media-manager:latest
    container_name: media-manager
    restart: unless-stopped
    ports:
      - "8500:8500"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      # ponytail: no live work-hours throttle in docker; cap total CPU below instead
    volumes:
      # same path inside and out — DB stores absolute paths
      - /srv/storage/Movies:/srv/storage/Movies
      - /DATA/AppData/media-manager:/app/data
    cpus: 5.0

x-casaos:
  architectures:
    - amd64
  main: media-manager
  author: antonio
  category: Media
  title:
    en_us: Media Manager
  description:
    en_us: Movie library cleaner — TMDB matching, track selection, remux and HEVC encode jobs with verification.
  icon: http://localhost:8500/static/apple-touch-icon.png
  port_map: "8500"
  scheme: http
  index: /
