<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Media Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Media Manager">
<meta name="theme-color" content="#0b0d12">
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0d12; --p1:#0e1218; --p2:#10141c; --p3:#12161f; --in1:#0b0e14; --in2:#0d1015;
    --hair:#161b25; --bd:#1c2230; --ctl:#232a38; --btn2:#2c3648;
    --track:#1a202c; --disc:#2a2e37; --foot:#0e1219; --dashTo:#0d1017;
    --hover:rgba(255,255,255,.04); --scrim:rgba(4,5,8,.7);
    --posterA:hsl(215 28% 22%); --posterB:hsl(215 35% 9%); --posterTx:rgba(255,255,255,.3);
    /* --faint carries real content (filenames, ETAs, counts) at 10-12px, so it
       has to clear 4.5:1 on every surface it sits on -- #5b6577 was 3.08:1 */
    --tx:#dfe5ee; --body:#c9d2e0; --mut:#8a94a6; --faint:#7a8497; --ghost:#7a8497;
    --acc:#8fb8d8; --shr:#e8c268; --fine:#7fc9a8; --dup:#b48ead; --err:#ff5d5d;
    --accBd:rgba(143,184,216,.35); --accBg:rgba(143,184,216,.08);
    --shrBd:rgba(232,194,104,.4); --shrBg:rgba(232,194,104,.13);
    --fineBd:rgba(127,201,168,.35); --fineBg:rgba(127,201,168,.1);
    --dupBd:rgba(180,142,173,.45); --errBd:rgba(255,93,93,.3);
    /* Overlay shadows only. Resting surfaces move up the panel ramp instead. */
    --shadowPop:rgba(0,0,0,.5); --shadowModal:rgba(0,0,0,.6);
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:-apple-system,system-ui,sans-serif; font-size:13px; }
  button { font:inherit; cursor:pointer; background:none; border:none; color:inherit; padding:0; }
  input, select { font:inherit; background:var(--p3); color:var(--tx); border:1px solid var(--ctl); border-radius:6px; padding:6px 10px; outline:none; }
  input:focus, select:focus { border-color:var(--acc); }
  ::placeholder { color:var(--faint); }

  /* one visible focus ring for every interactive thing, including the
     role=button cards -- :focus-visible keeps it off mouse clicks */
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; border-radius:4px; }
  input:focus-visible, select:focus-visible { outline-offset:0; }

  .visually-hidden { position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .mono { font-family:var(--mono); }
  .lbl { font:600 10px var(--mono); letter-spacing:.12em; color:var(--faint); text-transform:uppercase; }

  /* glow — everything behind one class on <body> so it can be disabled */
  body.glow .g-acc { box-shadow:0 0 8px rgba(143,184,216,.5); }
  body.glow .g-acc-lg { box-shadow:0 0 14px rgba(143,184,216,.5); }
  body.glow .g-acc-panel { box-shadow:0 0 20px rgba(143,184,216,.08); }
  body.glow .g-shr { box-shadow:0 0 16px rgba(232,194,104,.3); }
  body.glow .g-shr-badge { box-shadow:0 0 12px rgba(232,194,104,.45), inset 0 0 0 1px rgba(232,194,104,.6); }
  body.glow .g-fine-badge { box-shadow:inset 0 0 0 1px rgba(127,201,168,.35); }
  body.glow .g-fine { box-shadow:0 0 16px rgba(127,201,168,.45); }
  body.glow .g-fine-dot { box-shadow:0 0 6px rgba(127,201,168,.4); }
  body.glow .g-txt-fine { text-shadow:0 0 8px rgba(127,201,168,.4); }

  /* ---------- header ---------- */
  header { display:flex; align-items:center; gap:16px; padding:14px 22px; border-bottom:1px solid var(--hair); }
  header .brand { margin:0; font-size:15px; font-weight:700; letter-spacing:.02em; cursor:pointer; white-space:nowrap; }
  header .search { flex:1; max-width:340px; display:flex; align-items:center; gap:8px; background:var(--p3); border:1px solid var(--ctl); border-radius:8px; padding:0 14px; }
  header .search span { color:var(--ghost); }
  header .search input { flex:1; background:none; border:none; padding:8px 0; }
  header .hbtns { margin-left:auto; display:flex; gap:8px; align-items:center; position:relative; }
  .hbtn { font-size:12px; color:var(--mut); border:1px solid var(--ctl); border-radius:8px; padding:7px 12px; transition:background .12s ease-out; }
  .hbtn:hover { background:var(--hover); }
  .power-pill { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--acc); border:1px solid var(--accBd); border-radius:8px; padding:7px 12px; }
  .power-pill .dot { width:7px; height:7px; border-radius:50%; background:var(--acc); }
  .pop { position:absolute; top:calc(100% + 8px); right:0; z-index:30; background:var(--p2); border:1px solid var(--bd); border-radius:10px; padding:12px; min-width:220px; display:flex; flex-direction:column; gap:8px; box-shadow:0 8px 30px var(--shadowPop); }
  .pop button { text-align:left; font-size:12px; color:var(--mut); border:1px solid var(--ctl); border-radius:6px; padding:8px 11px; }
  .pop button.on { color:var(--acc); border-color:var(--accBd); background:var(--accBg); }

  /* ---------- dashboard ---------- */
  .dash { display:flex; align-items:stretch; margin:16px 22px; background:linear-gradient(135deg,var(--p2),var(--dashTo)); border:1px solid var(--bd); border-radius:12px; overflow:hidden; }
  .dash .ringzone { display:flex; align-items:center; gap:16px; padding:16px 22px; border-right:1px solid var(--hair); flex:none; }
  .ring { position:relative; width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
  .ring .inner { width:56px; height:56px; border-radius:50%; background:var(--in2); display:flex; align-items:center; justify-content:center; font:700 14px var(--mono); color:var(--fine); }
  .dash .stats { flex:1; display:grid; grid-template-columns:repeat(4,1fr); }
  .dash .cell { padding:14px 18px; border-right:1px solid var(--hair); min-width:0; }
  .dash .cell:last-child { border-right:none; }
  .dash .val { font:600 19px var(--mono); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dash .sub { font-size:12px; color:var(--faint); }
  .jobbar { height:3px; background:var(--track); border-radius:2px; margin-top:7px; overflow:hidden; }
  .jobbar > div { height:100%; background:var(--acc); }

  /* ---------- tabs ---------- */
  .tabs { display:flex; gap:6px; align-items:center; margin:0 22px; padding-bottom:12px; border-bottom:1px solid var(--hair); font:11px var(--mono); flex-wrap:nowrap; overflow-x:auto; }
  .tab { padding:6px 13px; border-radius:6px; border:1px solid var(--ctl); color:var(--mut); white-space:nowrap; transition:background .12s ease-out; }
  .tab.on { background:var(--shrBg); border-color:var(--shrBd); color:var(--shr); }
  .tabs .right { margin-left:auto; color:var(--faint); display:flex; gap:10px; align-items:center; white-space:nowrap; }
  .tabs .right select { font:11px var(--mono); padding:4px 6px; background:none; border:none; color:var(--faint); }
  .tabs .right label { cursor:pointer; }

  /* ---------- grid ---------- */
  .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding:18px 22px 22px; }
  .mcard { position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--bd); background:var(--p3); cursor:pointer; transition:border-color .12s ease-out; }
  .mcard.shrink { border-color:var(--shrBd); }
  .mcard:hover { border-color:var(--acc); }
  .mcard.shrink:hover { border-color:var(--shr); }
  .mcard .poster { aspect-ratio:2/3; width:100%; object-fit:cover; display:block; background:linear-gradient(160deg,var(--posterA),var(--posterB)); }
  .mcard .noposter { aspect-ratio:2/3; display:flex; align-items:center; justify-content:center; font:10px var(--mono); color:var(--posterTx); letter-spacing:.1em; text-align:center; padding:10px; background:linear-gradient(160deg,var(--posterA),var(--posterB)),repeating-linear-gradient(45deg,var(--hover) 0 6px,transparent 6px 12px); }
  .adv-badge { position:absolute; top:8px; left:8px; font:700 10px var(--mono); letter-spacing:.08em; background:rgba(10,11,15,.9); border-radius:4px; padding:3px 7px; }
  .adv-badge.shrink { color:var(--shr); }
  .adv-badge.fine { color:var(--fine); }
  .dup-badge { position:absolute; top:8px; right:8px; font:700 9px var(--mono); color:var(--dup); background:rgba(15,8,14,.85); border:1px solid var(--dupBd); border-radius:4px; padding:2px 6px; }
  .mcard .prog { position:absolute; left:0; right:0; height:3px; background:color-mix(in srgb, var(--track) 90%, transparent); }
  .mcard .prog > div { height:100%; background:var(--acc); }
  .mcard .foot { padding:8px 10px 9px; background:linear-gradient(180deg,var(--p3),var(--foot)); }
  .mcard .t { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mcard .row2 { display:flex; justify-content:space-between; margin-top:3px; font:11px var(--mono); color:var(--faint); }
  .mcard .spec { font:10px var(--mono); color:var(--faint); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- detail ---------- */
  .dwrap { max-width:960px; margin:0 auto; }
  .dtop { display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--hair); }
  /* 44px of hit area on the most-tapped control in the product -- it was an
     18px-tall line of text, and it is the way back from every detail page.
     Negative margin keeps the bar's visual height where it was. */
  .dtop .back { font-size:13px; color:var(--acc); cursor:pointer;
    display:inline-flex; align-items:center; min-height:44px; margin:-13px 0; padding-right:6px; }
  .stpill { margin-left:auto; display:flex; align-items:center; gap:6px; font:10px var(--mono); }
  .stpill .dot { width:6px; height:6px; border-radius:50%; }
  .ident { display:flex; gap:18px; padding:18px 22px 4px; }
  .ident img, .ident .noposter { width:110px; aspect-ratio:2/3; border-radius:8px; flex:none; object-fit:cover; }
  .ident .noposter { display:flex; align-items:center; justify-content:center; font:9px var(--mono); color:var(--posterTx); background:linear-gradient(160deg,var(--posterA),var(--posterB)); }
  /* h1, not h2: detail pages render no header, so the title IS the document's
     top level. Size stays on the Title step -- the tag changed, not the ramp. */
  .ident h1 { margin:0; font-size:19px; font-weight:700; }
  .ident h1 .yr { color:var(--faint); font-weight:400; }
  .ident .fn { font:11px var(--mono); color:var(--faint); margin-top:4px; word-break:break-all; }
  .spec-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; font:10px var(--mono); }
  .schip { border:1px solid var(--ctl); border-radius:4px; padding:3px 7px; color:var(--mut); }
  .schip.acc { border-color:var(--accBd); color:var(--acc); }
  .schip.shr { border-color:var(--shrBd); color:var(--shr); }
  .duprow { font-size:11px; color:var(--faint); margin-top:8px; }
  .duprow a { color:var(--dup); cursor:pointer; }

  .steps { padding:14px 22px 22px; display:flex; flex-direction:column; gap:10px; }
  .stepc { border:1px solid var(--bd); border-radius:10px; background:var(--p1); overflow:hidden; }
  .stepc.active { border-color:var(--accBd); }
  .stepc.pending { opacity:.55; }
  .step-head { display:flex; align-items:center; gap:12px; padding:10px 14px; }
  .stepc.open .step-head, .stepc.active .step-head { border-bottom:1px solid var(--hair); }
  .stepc .disc { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none; background:var(--disc); color:var(--mut); }
  .stepc.done .disc { background:var(--fine); color:var(--bg); }
  .stepc.active .disc { background:var(--acc); color:var(--bg); }
  .stepc .st { font-size:13px; font-weight:600; }
  .stepc .ssum { font-size:12px; color:var(--faint); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stepc .sact { margin-left:auto; font-size:11px; color:var(--mut); border:1px solid var(--ctl); border-radius:6px; padding:4px 9px; white-space:nowrap; }
  .step-body { padding:12px 14px; }
  .stepc.done:not(.open) .step-body, .stepc.pending .step-body { display:none; }
  .stepc.done .step-head { cursor:pointer; }
  .stepc.done:not(.open) .step-head { border-bottom:none; }

  /* track rows */
  .trow { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--p2); border:1px solid var(--bd); border-radius:8px; margin-top:6px; }
  .trow.drop { opacity:.45; }
  .updown { display:flex; flex-direction:column; gap:3px; flex:none; }
  .updown button { width:24px; height:17px; border:1px solid var(--ctl); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px; line-height:1; color:var(--mut); }
  .updown button:hover { color:var(--tx); border-color:var(--btn2); }
  .keep-pill { font:700 9px var(--mono); letter-spacing:.08em; border-radius:4px; padding:4px 8px; flex:none; }
  .keep-pill.on { color:var(--fine); background:var(--fineBg); border:1px solid var(--fineBd); }
  .keep-pill.off { color:var(--mut); background:none; border:1px solid var(--btn2); }
  .trow .cinfo { width:170px; flex:none; min-width:0; }
  .trow .cinfo.grow { width:auto; flex:1; }
  .trow .cinfo .cc.wrap, .trow .cinfo .cm.wrap { white-space:normal; overflow:visible; text-overflow:clip; }
  .trow.stacked { align-items:flex-start; }
  .trow .cinfo .cc { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trow .cinfo .cm { font:10px var(--mono); color:var(--faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trow select.lang { font:10px var(--mono); color:var(--mut); border:1px solid var(--ctl); border-radius:4px; padding:4px 6px; background:none; flex:none; }
  .fchip { font:700 9px var(--mono); border-radius:4px; padding:4px 7px; flex:none; letter-spacing:.02em; }
  .fchip.def { color:var(--acc); border:1px solid var(--accBd); }
  .fchip.forc { color:var(--shr); border:1px solid var(--shrBd); }
  .fchip.dim { opacity:.3; border-color:var(--ctl); color:var(--mut); }
  .trow input.nm { flex:1; min-width:0; font:11px var(--mono); color:var(--mut); background:var(--in1); border:1px solid var(--bd); border-radius:6px; padding:6px 9px; }

  .btnrow { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn { font-size:12px; color:var(--mut); border:1px solid var(--ctl); border-radius:7px; padding:7px 13px; transition:background .12s ease-out; }
  .btn:hover { background:var(--hover); }
  .btn.primary { font-weight:600; color:var(--bg); background:var(--acc); border-color:var(--acc); }
  .btn.gold { font-size:13px; font-weight:700; color:var(--bg); background:var(--shr); border-color:var(--shr); padding:9px 16px; }
  .btn.ghost2 { font-size:13px; font-weight:600; color:var(--body); border:1px solid var(--btn2); padding:9px 14px; }
  .btn.fine { font-size:13px; font-weight:600; color:var(--fine); border:1px solid var(--fineBd); padding:9px 14px; }
  .btn.danger { color:var(--err); border:1px solid var(--errBd); }
  .btn:disabled { opacity:.4; cursor:default; }
  .linky { font-size:12px; color:var(--faint); padding:9px 4px; cursor:pointer; }
  .linky:hover { color:var(--mut); }

  .advbanner { display:flex; align-items:center; gap:10px; border-radius:8px; padding:10px 14px; font-size:13px; flex-wrap:wrap; }
  .advbanner.shrink { background:var(--shrBg); border:1px solid var(--shrBd); }
  .advbanner.fine { background:var(--fineBg); border:1px solid var(--fineBd); }
  .advbanner b.s { color:var(--shr); } .advbanner b.f { color:var(--fine); }
  .advbanner span { color:var(--body); }

  /* RF chart */
  .rfpanel { margin-top:14px; border:1px solid var(--bd); border-radius:10px; background:var(--in1); padding:14px 16px; }
  .rfhead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .rfhead .src { margin-left:auto; font:11px var(--mono); color:var(--faint); }
  .rfhead input { width:56px; font-size:11px; padding:4px 8px; border-radius:6px; }
  .rfcols { display:flex; gap:14px; align-items:flex-end; margin-top:14px; height:150px; overflow-x:auto; }
  .rfcol { flex:1; min-width:64px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:5px; height:100%; cursor:pointer; }
  .rfcol .recl { font:700 9px var(--mono); letter-spacing:.1em; color:var(--fine); }
  .rfcol .sz { font:600 12px var(--mono); color:var(--mut); }
  .rfcol .pct { font:10px var(--mono); color:var(--faint); }
  .rfcol .bar { width:100%; border-radius:6px 6px 2px 2px; background:rgba(143,184,216,.28); border:1px solid transparent; }
  .rfcol.rec .bar { background:linear-gradient(180deg,var(--fine),rgba(127,201,168,.45)); border-color:rgba(127,201,168,.55); }
  .rfcol.rec .sz { color:var(--fine); }
  .rfcol.sel .bar { border-color:var(--acc); }
  .rflabels { display:flex; gap:14px; margin-top:8px; overflow-x:auto; }
  .rflab { flex:1; min-width:64px; text-align:center; }
  .rflab .rf { font:700 11px var(--mono); color:var(--mut); }
  .rflab.rec .rf { color:var(--fine); }
  .rflab .tag { font:9px var(--mono); color:var(--faint); letter-spacing:.06em; margin-top:2px; }
  .rflab .lnk { font-size:10px; margin-top:5px; color:var(--faint); }
  .rflab .lnk a { color:var(--acc); cursor:pointer; text-decoration:none; }
  .rflab .lnk span.x { cursor:pointer; }
  .qaxis { height:5px; border-radius:3px; margin-top:14px; background:linear-gradient(90deg,var(--fine),var(--shr),var(--err)); }
  .qlbl { display:flex; justify-content:space-between; font:9px var(--mono); color:var(--faint); letter-spacing:.08em; margin-top:5px; }

  pre.cmd { background:var(--in1); border:1px solid var(--bd); border-radius:8px; padding:10px 12px; font:11px var(--mono); overflow-x:auto; white-space:pre-wrap; word-break:break-all; color:var(--mut); margin:10px 0 0; }

  /* job progress in step 3 */
  .jprog { margin-top:12px; }
  .jprog .row { display:flex; align-items:baseline; gap:10px; font:600 13px var(--mono); color:var(--acc); }
  .jprog .eta { font:11px var(--mono); color:var(--faint); font-weight:400; }
  .jprog .bar { height:6px; background:var(--track); border-radius:3px; margin-top:8px; overflow:hidden; }
  .jprog .bar > div { height:100%; background:var(--acc); }

  /* tmdb candidates */
  .cand { display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--bd); border-radius:8px; margin-top:6px; cursor:pointer; background:var(--p2); }
  .cand:hover { border-color:var(--acc); }
  .cand img { width:40px; height:60px; object-fit:cover; border-radius:4px; flex:none; }
  .cand .cl { color:var(--faint); font-size:11px; }

  /* ---------- modal ---------- */
  .mback { position:fixed; inset:0; background:var(--scrim); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .mpanel { background:var(--p2); border:1px solid var(--bd); border-radius:12px; max-width:480px; width:100%; max-height:80vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 50px var(--shadowModal); }
  .mpanel.danger { border-color:var(--errBd); }
  .mhead { padding:14px 18px; font-size:14px; font-weight:700; border-bottom:1px solid var(--hair); }
  .mpanel.danger .mhead { background:rgba(255,93,93,.08); color:var(--err); }
  .mbody { padding:14px 18px; overflow-y:auto; font-size:13px; color:var(--body); line-height:1.5; }
  .mbody .files { font:11px var(--mono); color:var(--mut); background:var(--in1); border:1px solid var(--bd); border-radius:8px; padding:10px; max-height:200px; overflow-y:auto; margin-top:10px; white-space:pre-wrap; word-break:break-all; }
  .mbody input { width:100%; margin-top:10px; font-family:var(--mono); }
  .mfoot { padding:12px 18px; display:flex; gap:8px; justify-content:flex-end; border-top:1px solid var(--hair); }
  .holdbtn { position:relative; overflow:hidden; }
  .holdbtn .fill { position:absolute; inset:0; width:0%; background:rgba(255,93,93,.25); transition:none; }
  .holdbtn.fine .fill { background:rgba(127,201,168,.25); }

  /* Live-stream outage banner. Sticky rather than fixed: fixed positioning
     laid it over the header and sliced the brand, search and buttons in half.
     In flow it pushes the page down, and still pins to the top when scrolled.
     Empty is the resting state -- see setLiveState for why it holds no
     markup until there is something to announce. */
  #livewarn { position:sticky; top:0; z-index:70; text-align:center;
    background:var(--p2); border-bottom:1px solid var(--shrBd); color:var(--shr);
    font:12px var(--mono); padding:7px 14px; }
  #livewarn:empty { display:none; }

  /* toast */
  #toasts { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; width:min(480px,92vw); }
  .toast { background:var(--p2); border:1px solid var(--errBd); border-radius:8px; padding:10px 14px; font:12px var(--mono); color:var(--err); cursor:pointer; word-break:break-word; }

  .skel { background:var(--p2); border-radius:10px; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:.9} }
  .empty { padding:40px; text-align:center; color:var(--faint); font:12px var(--mono); letter-spacing:.08em; }

  /* ---------- tablet / small laptop ----------
     the brief's 6-column grid is sized for a wide desktop; between 700 and
     1100px those columns collapse to ~110px and the footer text stops being
     readable, so step the count down instead of holding 6 everywhere */
  @media (min-width:701px) and (max-width:1100px) {
    .grid { grid-template-columns:repeat(4,1fr); }
    .dash .stats { grid-template-columns:repeat(2,1fr); }
    .dash .cell:nth-child(2) { border-right:none; }
    .dash .cell:nth-child(1), .dash .cell:nth-child(2) { border-bottom:1px solid var(--hair); }
  }
  @media (min-width:1101px) and (max-width:1320px) {
    .grid { grid-template-columns:repeat(5,1fr); }
  }

  /* ---------- mobile ---------- */
  @media (max-width:700px) {
    header { gap:10px; padding:12px 14px; flex-wrap:wrap; }
    header .search { max-width:none; order:3; flex-basis:100%; }
    .dash { flex-direction:column; margin:12px 14px; }
    .dash .ringzone { border-right:none; border-bottom:1px solid var(--hair); }
    .dash .stats { grid-template-columns:repeat(2,1fr); }
    .dash .cell:nth-child(2) { border-right:none; }
    .dash .cell { border-bottom:1px solid var(--hair); }
    .dash .cell:nth-child(3), .dash .cell:nth-child(4) { border-bottom:none; }
    .tabs { margin:0 14px; }
    .grid { grid-template-columns:repeat(3,1fr); gap:10px; padding:14px; }
    .mcard .spec { display:none; }
    .mcard .row2 span:first-child { display:none; }
    .dtop, .ident { padding-left:14px; padding-right:14px; }
    .steps { padding:12px 14px 18px; }
    .trow { flex-wrap:wrap; }
    .trow input.nm { flex-basis:100%; order:9; }
    .btn, .hbtn { min-height:44px; display:inline-flex; align-items:center; }
    /* 44px on the row controls too -- they were 24x32, which clears WCAG 2.5.8
       AA (24px) but is still a small target for a thumb on a moving list */
    .keep-pill, .fchip { min-height:44px; display:inline-flex; align-items:center; }
    /* Two stacked arrows can't both be 44px tall without making every track row
       ~90px, so they take the full 44px width and as much height as the row can
       carry. Well clear of WCAG 2.2's 24px floor, and a real thumb target. */
    .updown button { width:44px; height:38px; }
    .linky { min-height:44px; display:inline-flex; align-items:center; }
    .mback { align-items:flex-end; padding:0; }
    .mpanel { max-width:none; border-radius:12px 12px 0 0; }
  }

  /* Drop looping and decorative motion, keep colour-state feedback. Every
     transition in this file is background or border-color at 120ms -- those
     carry no motion at all, and blanket-killing them only cost hover, focus
     and keep/drop feedback for the users least able to spare it.
     LAST in the sheet on purpose: `.skel { animation:none }` sat above the
     `.skel` base rule for months and lost to it on source order, so the
     skeleton pulse kept running for exactly the people who asked it not to. */
  @media (prefers-reduced-motion: reduce) {
    .skel { animation:none; opacity:.7; }
    *, *::before, *::after {
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-property:background-color,border-color,color,opacity !important;
    }
  }
</style>
</head>
<body class="glow">
<div id="livewarn" role="status" aria-live="polite"></div>
<main id="page"></main>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
// ---------- utils ----------
const api = (path, opts) => fetch(path, opts).then(async r => {
  if (!r.ok) { const t = await r.text(); throw new Error(t || r.statusText); }
  return r.status === 204 ? null : r.json();
});
const esc = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const posterUrl = p => p ? `https://image.tmdb.org/t/p/w342${p}` : null;
const fmtG = b => !b ? '' : (b / 1e9 >= 1 ? (b / 1e9).toFixed(1) + ' G' : (b / 1e6).toFixed(0) + ' M');
const fmtTB = b => b >= 1e12 ? (b / 1e12).toFixed(2) + ' TB' : (b / 1e9).toFixed(0) + ' GB';
const resOf = m => m.height ? (m.height >= 2000 ? '4K' : m.height >= 1000 ? '1080p' : m.height + 'p') : '';
const barFor = m => (m.height || 0) >= 2000 ? 25 : (m.height || 0) >= 1000 ? 15 : 8;
const KIND_LABEL = { remux: 'Quick Remux', encode: 'Heavy Encode', sample: 'Sample' };
const INFLIGHT = ['cleaning', 'encoding', 'working'];

function toast(msg, isError) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  // errors carry role=alert so they're announced even mid-utterance; the
  // container's polite live region handles the routine confirmations
  if (isError) el.setAttribute('role', 'alert');
  el.onclick = () => el.remove();
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 8000);
}
const oops = e => toast(e.message || String(e), true);

// ---------- modal ----------
// modal({title, html, confirmLabel, mode:'plain'|'typed'|'hold', expect, danger, holdClass}) -> Promise<bool>
function modal(o) {
  return new Promise(resolve => {
    const root = document.getElementById('modal-root');
    const typed = o.mode === 'typed';
    const returnFocus = document.activeElement;   // restored on close
    const titleId = 'mtitle';
    root.innerHTML = `<div class="mback">
      <div class="mpanel ${o.danger ? 'danger' : ''}" role="dialog" aria-modal="true" aria-labelledby="${titleId}">
        <div class="mhead" id="${titleId}">${esc(o.title)}</div>
        <div class="mbody">${o.html || ''}${typed ? `<label class="visually-hidden" for="mtyped">Type ${esc(o.expect)} to confirm</label><input id="mtyped" placeholder="type: ${esc(o.expect)}" autocomplete="off">` : ''}</div>
        <div class="mfoot">
          <button class="btn" id="mcancel">Cancel</button>
          <button class="btn ${o.danger ? 'danger' : 'fine'} ${o.mode === 'hold' ? 'holdbtn' + (o.danger ? '' : ' fine') : ''}" id="mok" ${typed ? 'disabled' : ''} style="padding:7px 16px"
            ${o.mode === 'hold' ? 'aria-describedby="mholdhint"' : ''}>
            ${o.mode === 'hold' ? '<span class="fill"></span>' : ''}<span style="position:relative">${esc(o.confirmLabel || 'Confirm')}</span>
          </button>
          ${o.mode === 'hold' ? '<span id="mholdhint" class="visually-hidden">Press and hold, or hold Enter or Space, for one second to confirm.</span>' : ''}
        </div>
      </div></div>`;

    const panel = root.querySelector('.mpanel');
    const done = v => {
      document.removeEventListener('keydown', onKey, true);
      root.innerHTML = '';
      if (returnFocus && returnFocus.focus) returnFocus.focus();
      resolve(v);
    };

    // Escape closes; Tab is trapped inside the panel
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); done(false); return; }
      if (e.key !== 'Tab') return;
      const f = [...panel.querySelectorAll('button,input,select,textarea,a[href]')]
        .filter(el => !el.disabled && el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', onKey, true);

    root.querySelector('.mback').onclick = e => { if (e.target === e.currentTarget) done(false); };
    document.getElementById('mcancel').onclick = () => done(false);
    const ok = document.getElementById('mok');
    if (typed) {
      const inp = document.getElementById('mtyped');
      inp.oninput = () => { ok.disabled = inp.value.trim() !== o.expect; };
      inp.focus();
      ok.onclick = () => done(true);
    } else if (o.mode === 'hold') {
      // hold 0.8s to confirm — fill animates via rAF. Keyboard gets the same
      // deliberate friction by holding Enter/Space, rather than being locked
      // out of every destructive action entirely.
      let t0 = null, raf = null, holding = false;
      const fill = ok.querySelector('.fill');
      const step = ts => {
        if (!t0) t0 = ts;
        const p = Math.min(1, (ts - t0) / 800);
        fill.style.width = (p * 100) + '%';
        if (p >= 1) { done(true); return; }
        raf = requestAnimationFrame(step);
      };
      const start = e => {
        if (e && e.preventDefault) e.preventDefault();
        if (holding) return;            // ignore key auto-repeat
        holding = true; t0 = null; raf = requestAnimationFrame(step);
      };
      const stop = () => { holding = false; cancelAnimationFrame(raf); fill.style.width = '0%'; };
      ok.onmousedown = start; ok.ontouchstart = start;
      ok.onmouseup = ok.onmouseleave = ok.ontouchend = stop;
      ok.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') start(e); };
      ok.onkeyup = e => { if (e.key === 'Enter' || e.key === ' ') stop(); };
      ok.onblur = stop;
      ok.focus();
    } else {
      ok.onclick = () => done(true);
      ok.focus();
    }
  });
}

// Enter/Space activate any element we've marked role="button" (cards, links,
// chart columns). One delegated listener instead of handlers on every node.
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[role="button"]');
  if (!el || el.tagName === 'BUTTON' || el.tagName === 'INPUT') return;
  e.preventDefault();
  el.click();
});

// ---------- state ----------
let MOVIES = [], SHOWS = [], JOBS = [], POWER = null, STATS = { reclaimed_bytes: 0 };
let TAB = 'needs', SORT = 'size', DUPONLY = false, Q = '';
let SCAN = { running: false };
let TRACKSTATE = null;   // {audio:[], subs:[]} while a detail page is open
let TRACK_BASE = 'movies';  // 'movies' | 'episodes' -- which API the track editor writes to
let TRACK_ID = null;        // owner id (movie or episode) for the open track editor
let SELRF = null, SAMPLES = [], CURID = null, VIDEOTRACK = null;
const WATCHING = new Map();    // job id -> what to refresh when it finishes; cleared on navigation
let DASHSIG = '';              // last painted dashboard signature
let CURSHOWID = null;   // set while a show/episode page is open (movie CURID stays null there)
let powerPopOpen = false, maintPopOpen = false;

// ---------- routing ----------
window.onhashchange = route;
window.onload = () => {
  route();
  connectEvents();   // job + scan progress arrive pushed, no polling
  api('/api/power').then(p => { POWER = p; paintHeaderPower(); }).catch(() => {});
  api('/api/stats').then(s => { STATS = s; if (!CURID) paintDash(); }).catch(() => {});
};
function route() {
  const mv = location.hash.match(/^#\/movie\/(\d+)/);
  const sh = location.hash.match(/^#\/show\/(\d+)/);
  const ep = location.hash.match(/^#\/episode\/(\d+)/);
  powerPopOpen = maintPopOpen = false;
  WATCHING.clear();   // drops watchers belonging to the page we're leaving
  if (mv) { CURID = parseInt(mv[1]); CURSHOWID = null; TRACK_BASE = 'movies'; renderDetail(CURID); }
  else if (sh) { CURID = null; CURSHOWID = parseInt(sh[1]); renderShow(CURSHOWID); }
  else if (ep) { CURID = null; CURSHOWID = null; TRACK_BASE = 'episodes'; renderEpisode(parseInt(ep[1])); }
  else { CURID = null; CURSHOWID = null; TRACKSTATE = null; renderHome(); }
}

// ---------- header ----------
function headerHtml() {
  return `<header>
    <h1 class="brand" role="button" tabindex="0" onclick="location.hash=''">Media Manager</h1>
    <div class="search"><span aria-hidden="true">⌕</span>
      <label class="visually-hidden" for="q">Search library</label>
      <input id="q" type="search" placeholder="Search library" value="${esc(Q)}" oninput="qChanged(this.value)"></div>
    <div class="hbtns">
      <button class="hbtn" onclick="doScan()">⟳ Scan</button>
      <button class="hbtn" onclick="toggleMaint(event)">Maintenance ▾</button>
      <button class="power-pill" onclick="togglePower(event)"><span class="dot g-acc"></span><span id="powerlbl">${powerLabel()}</span></button>
      <div class="pop" id="maintpop" style="display:${maintPopOpen ? 'flex' : 'none'}">
        <button onclick="doCleanupJunk()">Purge junk files…</button>
      </div>
      <div class="pop" id="powerpop" style="display:${powerPopOpen ? 'flex' : 'none'}">
        <div class="lbl">CPU for encode jobs</div>
        <button class="${POWER?.mode === 'auto' ? 'on' : ''}" onclick="setPowerMode('auto')">⚡ Auto — follows work hours</button>
        <button class="${POWER?.mode === 'full' ? 'on' : ''}" onclick="setPowerMode('full')">⚡ Full power</button>
        <button class="${POWER?.mode === 'throttle' ? 'on' : ''}" onclick="setPowerMode('throttle')">🐢 Throttle</button>
        ${POWER?.mode === 'auto' ? `<div style="display:flex;gap:8px;align-items:center"><span class="lbl">Hours</span>
          <input id="workHours" aria-label="Work hours range, for example 9-23" value="${esc(POWER?.work_hours || '')}" style="width:80px;font-family:var(--mono);font-size:12px" onchange="setWorkHours(this.value)"></div>` : ''}
      </div>
    </div>
  </header>`;
}
function powerLabel() {
  if (!POWER) return 'Power';
  if (POWER.mode === 'full') return 'Full power';
  if (POWER.mode === 'throttle') return 'Throttled';
  const [a, b] = (POWER.work_hours || '9-23').split('-');
  return `Auto power · ${String(a).padStart(2, '0')}–${String(b).padStart(2, '0')}`;
}
function paintHeaderPower() { const el = document.getElementById('powerlbl'); if (el) el.textContent = powerLabel(); }
function togglePower(e) { e.stopPropagation(); powerPopOpen = !powerPopOpen; maintPopOpen = false; syncPops(); }
function toggleMaint(e) { e.stopPropagation(); maintPopOpen = !maintPopOpen; powerPopOpen = false; syncPops(); }
function syncPops() {
  const pp = document.getElementById('powerpop'), mp = document.getElementById('maintpop');
  if (pp) pp.style.display = powerPopOpen ? 'flex' : 'none';
  if (mp) mp.style.display = maintPopOpen ? 'flex' : 'none';
}
document.addEventListener('click', () => { if (powerPopOpen || maintPopOpen) { powerPopOpen = maintPopOpen = false; syncPops(); } });
async function setPowerMode(mode) {
  POWER = await api('/api/power', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ mode }) }).catch(oops) || POWER;
  powerPopOpen = true; repaintHeader();
}
async function setWorkHours(v) {
  POWER = await api('/api/power', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ work_hours: v }) }).catch(oops) || POWER;
  powerPopOpen = true; repaintHeader();
}
function repaintHeader() {
  const old = document.querySelector('header');
  if (!old) return;
  const tmp = document.createElement('div'); tmp.innerHTML = headerHtml();
  old.replaceWith(tmp.firstElementChild);
}

let qTimer;
function qChanged(v) { Q = v; clearTimeout(qTimer); qTimer = setTimeout(() => loadMovies().then(paintHomeBody), 250); }

// ---------- home ----------
async function renderHome() {
  document.getElementById('page').innerHTML = headerHtml() + `
    <div id="dash"></div><div id="tabs"></div><div id="gridwrap"><div class="grid">${'<div class="skel" style="aspect-ratio:2/3.4"></div>'.repeat(12)}</div></div>`;
  await loadMovies();
  paintHomeBody();
}
async function loadMovies() {
  const params = new URLSearchParams();
  if (Q) params.set('q', Q);
  MOVIES = await api('/api/movies?' + params).catch(e => { oops(e); return MOVIES; });
  SHOWS = await api('/api/shows?' + params).catch(() => SHOWS);
}
function paintHomeBody() { if (CURID) return; paintDash(); paintTabs(); paintGrid(); }

function bucketOf(m) {
  if (INFLIGHT.includes(m.status)) return 'flight';
  if (m.status === 'clean') return 'done';
  if (m.advice === 'encode') return 'needs';
  return 'other';
}
function paintDash() {
  const el = document.getElementById('dash');
  if (!el) return;
  const total = MOVIES.length;
  const totalB = MOVIES.reduce((a, m) => a + (m.size_bytes || 0), 0);
  const done = MOVIES.filter(m => m.status === 'clean').length;
  const queue = MOVIES.filter(m => bucketOf(m) === 'needs');
  // ponytail: 0.72 savings factor = observed x265 shrink on this library's remuxes
  const onTable = queue.reduce((a, m) => a + (m.size_bytes || 0), 0) * 0.72;
  const pct = total ? Math.round(100 * done / total) : 0;
  const deg = Math.round(360 * pct / 100);
  const running = JOBS.find(j => j.status === 'running');
  const queued = JOBS.filter(j => j.status === 'queued').length;
  let jobCell;
  if (SCAN.running) {
    jobCell = `<div class="val" style="font-size:13px;color:var(--acc)">SCAN ${SCAN.done}/${SCAN.total}</div>
      <div class="sub mono" style="font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(SCAN.current || '')}</div>`;
  } else if (running) {
    const nm = (running.movie_title || '').replace(/\s*\(\d{4}\)$/, '').toUpperCase();
    jobCell = `<div style="display:flex;align-items:baseline;gap:8px;margin-top:4px;min-width:0">
        <span class="mono" style="font-weight:600;font-size:13px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(nm)} · ${(running.progress || 0).toFixed(0)}%</span>
        ${running.eta ? `<span class="mono" style="font-size:11px;color:var(--faint)">ETA ${esc(running.eta.toUpperCase())}</span>` : ''}</div>
      <div class="jobbar" role="progressbar" aria-valuenow="${Math.round(running.progress || 0)}" aria-valuemin="0" aria-valuemax="100" aria-label="Encode progress"><div class="g-acc" style="width:${running.progress || 0}%"></div></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
        ${queued ? `<span class="sub mono" style="font-size:10px">+${queued} QUEUED</span>` : ''}
        <button class="btn danger" style="padding:2px 8px;font-size:10px" onclick="cancelJob(${running.id})">Cancel</button>
      </div>`;
  } else {
    jobCell = `<div class="val" style="color:var(--faint)">idle</div>`;
  }
  // polled every 3s -- skip the full innerHTML teardown when nothing moved
  const sig = [total, totalB, done, queue.length, pct, STATS.reclaimed_bytes,
               SCAN.running, SCAN.done, SCAN.total, SCAN.current,
               running && running.id, running && running.progress, running && running.eta, queued].join('|');
  if (sig === DASHSIG && el.firstElementChild) return;
  DASHSIG = sig;
  el.innerHTML = `<div class="dash">
    <div class="ringzone">
      <div class="ring" role="img" aria-label="${pct} percent of the library triaged, ${done} of ${total}" style="background:conic-gradient(var(--fine) 0 ${deg}deg,var(--track) ${deg}deg 360deg)"><div class="inner" aria-hidden="true">${pct}%</div></div>
      <div>
        <div style="font-size:14px;font-weight:600">${done} of ${total} triaged</div>
        <div style="font-size:12px;color:var(--mut);margin-top:3px"><span style="color:var(--shr);font-weight:600">~${fmtTB(onTable)}</span> still on the table</div>
      </div>
    </div>
    <div class="stats">
      <div class="cell"><div class="lbl">Reclaimed</div><div class="val" style="color:var(--fine)">${STATS.reclaimed_bytes ? fmtTB(STATS.reclaimed_bytes) : '0 GB'}</div></div>
      <div class="cell"><div class="lbl">Library</div><div class="val">${fmtTB(totalB)}<span style="font-size:12px;color:var(--faint)"> · ${total}</span></div></div>
      <div class="cell"><div class="lbl">Shrink queue</div><div class="val" style="color:var(--shr)">${queue.length}<span style="font-size:12px;color:var(--faint)"> files</span></div></div>
      <div class="cell"><div class="lbl">Active job</div>${jobCell}</div>
    </div>
  </div>`;
}
function paintTabs() {
  const el = document.getElementById('tabs');
  if (!el) return;
  const counts = { needs: 0, flight: 0, done: 0 };
  MOVIES.forEach(m => { const b = bucketOf(m); if (counts[b] !== undefined) counts[b]++; });
  const t = (id, label, n) => `<button class="tab ${TAB === id ? 'on' : ''}" aria-pressed="${TAB === id}" onclick="TAB='${id}';paintTabs();paintGrid()">${label} ${n}</button>`;
  el.innerHTML = `<div class="tabs">
    ${t('needs', 'NEEDS DECISION', counts.needs)}${t('flight', 'IN FLIGHT', counts.flight)}${t('done', 'DONE', counts.done)}${t('all', 'ALL', MOVIES.length)}${t('shows', 'TV SHOWS', SHOWS.length)}
    <div class="right">
      <span aria-hidden="true">SORT:</span><select aria-label="Sort library by" onchange="SORT=this.value;paintGrid()">
        <option value="size" ${SORT === 'size' ? 'selected' : ''}>SIZE ▾</option>
        <option value="title" ${SORT === 'title' ? 'selected' : ''}>TITLE</option></select>
      <label>DUP <input type="checkbox" aria-label="Show only duplicates" ${DUPONLY ? 'checked' : ''} onchange="DUPONLY=this.checked;paintGrid()"></label>
    </div></div>`;
}
function paintGrid() {
  const el = document.getElementById('gridwrap');
  if (!el) return;
  if (TAB === 'shows') {
    const ss = [...SHOWS].sort((a, b) => (a.title || a.clean_title || a.folder).localeCompare(b.title || b.clean_title || b.folder));
    el.innerHTML = ss.length ? `<div class="grid">${ss.map(showCardHtml).join('')}</div>` : '<div class="empty">NO SHOWS FOUND</div>';
    return;
  }
  let ms = MOVIES.filter(m => TAB === 'all' || bucketOf(m) === TAB);
  if (DUPONLY) ms = ms.filter(m => m.dup);
  ms.sort(SORT === 'size' ? (a, b) => (b.size_bytes || 0) - (a.size_bytes || 0)
                          : (a, b) => (a.title || a.clean_title || a.folder).localeCompare(b.title || b.clean_title || b.folder));
  el.innerHTML = ms.length ? `<div class="grid">${ms.map(cardHtml).join('')}</div>` : '<div class="empty">NOTHING HERE</div>';
}
function showCardHtml(s) {
  const title = s.title || s.clean_title || s.folder;
  const poster = posterUrl(s.poster_path);
  const STMAP = { unprocessed: 'var(--mut)', ready: 'var(--fine)', encoding: 'var(--acc)', clean: 'var(--fine)', error: 'var(--err)' };
  return `<div class="mcard" role="button" tabindex="0"
    aria-label="${esc(title)}, TV show, status ${esc(s.status || 'unknown')}"
    onclick="location.hash='#/show/${s.id}'">
    ${poster ? `<img class="poster" src="${poster}" alt="" loading="lazy">` : `<div class="noposter">${esc(title)}</div>`}
    <div class="foot">
      <div class="t">${esc(title)}</div>

function cardHtml(m) {

// ---------- scan ----------
// progress and the reload-when-finished both arrive over the event stream
async function doScan() { await api('/api/scan', { method: 'POST' }).catch(oops); }

// ---------- junk ----------
async function doCleanupJunk() {
  const p = await api('/api/junk/preview').catch(e => { oops(e); return null; });
  if (!p) return;
  if (!p.total) { toast('No junk files found.'); return; }
  const list = Object.entries(p.folders).flatMap(([folder, files]) =>
    files.map(f => `${folder === '__top_level__' ? '' : folder + '/'}${f}`));
  const ok = await modal({
    title: `Purge ${p.total} junk file(s)`, danger: true, mode: 'hold', confirmLabel: 'Hold to purge',
    html: `These files will be permanently deleted:<div class="files">${list.map(esc).join('\n')}</div>`,
  });
  if (!ok) return;
  const r = await api('/api/junk/apply', { method: 'POST' }).catch(oops);
  if (r) toast(`Removed ${r.removed} junk file(s).${r.errors.length ? ' ' + r.errors.length + ' error(s).' : ''}`);
}

// ---------- live state (SSE) ----------
// One server-pushed stream replaces what used to be three poll chains: the job
// list, the scan status, and a per-job completion watcher. EventSource handles
// reconnection itself, so there is no retry logic here.
let ES = null;
function connectEvents() {
  if (ES) ES.close();
  ES = new EventSource('/api/events');
  ES.onmessage = e => { applyEvents(JSON.parse(e.data)); };
  // onerror fires on every reconnect attempt too, so it must not be noisy --
  // the browser retries on its own and the next onmessage clears the banner
  ES.onerror = () => { setLiveState(ES.readyState === 2 ? 'closed' : 'reconnecting'); };
  ES.onopen = () => setLiveState('live');
}
function applyEvents(d) {
  const wasScanning = SCAN.running;
  JOBS = d.jobs;
  SCAN = d.scan;
  setLiveState('live');
  if (!CURID) paintDash();
  else paintDetailJob();
  // the show page's batch panel is plain markup inside renderShow -- repaint it
  // here so a 105-job queue doesn't sit at a frozen percentage
  const sp = document.getElementById('showJobPanel');
  if (sp && SHOWDATA) sp.innerHTML = showJobsHtml(SHOWDATA);
  reapWatched();
  // a finished scan changes the library itself, not just its progress number
  if (wasScanning && !SCAN.running && !CURID) loadMovies().then(paintHomeBody);
}
// A dead stream must be visible: silently frozen progress bars are worse than
// an honest "reconnecting", because the user can't tell them from a stalled job.
let LIVESTATE = 'live';
const STALE_MSG = 'Lost the live connection — progress may be stale. Reconnecting…';
function setLiveState(s) {
  if (s === LIVESTATE) return;
  LIVESTATE = s;
  const el = document.getElementById('livewarn');
  if (!el) return;
  // Writing INTO an empty live region is what makes a screen reader speak.
  // The previous version kept the sentence in the DOM and toggled display,
  // which announces nothing -- so the one user who cannot see the progress
  // bars freeze was also the one user never told the connection had dropped.
  el.textContent = s === 'live' ? '' : STALE_MSG;
}

// A 'done' step collapses its body; this makes the header reopen it. Must run
// after EVERY page that renders step cards -- when only renderDetail called it,
// the show page's completed steps were permanently sealed shut.
function wireStepToggles() {
  document.querySelectorAll('.stepc.done .step-head').forEach(h => {
    h.setAttribute('role', 'button');

    h.setAttribute('aria-expanded', h.parentElement.classList.contains('open') ? 'true' : 'false');
    h.onclick = e => {
      if (e.target.closest('input,button,select')) return;
      const open = h.parentElement.classList.toggle('open');
      h.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
  });
}

// ---------- step 3: process ----------
function tagForRF(rf) { return rf <= 18 ? 'NEAR-LOSSLESS' : rf <= 21 ? 'EXCELLENT' : rf <= 23 ? 'SWEET SPOT' : 'QUALITY RISK'; }

  const barBits = barFor(m) * 1e6;
  const ok = SAMPLES.filter(s => s.est_full_bytes && (s.est_full_bytes * 8 / m.duration) <= barBits)

function step3Html(m, running) {

    : `<div class="advbanner fine"><b class="f">QUALITY FINE</b><span>${mbps ?? '?'} Mbps is at or under the ${bar} Mbps bar for ${res} — accept as-is, or quick-remux if the tracks need cleanup.</span></div>`) : '';
  const selSample = SAMPLES.find(s => s.rf === SELRF);
  const est = selSample && selSample.est_full_bytes ? ` · est ~${fmtG(selSample.est_full_bytes)}` : '';
  return `${banner}
    <div class="btnrow" style="margin-top:12px">
      <button class="btn gold ${shrink ? 'g-shr' : ''}" onclick="runJob(${m.id}, 'encode')">Heavy Encode @ RF <span id="encRf">${SELRF}</span><span id="encEst">${est}</span></button>

      <button class="btn fine" onclick="acceptAsIs(${m.id}, '${esc(m.title || m.clean_title || '')}')">Accept as-is</button>
      <span class="linky" role="button" tabindex="0" onclick="previewCmd(${m.id})">view command ›</span>

}
function rfChartHtml(m) {

  const rec = recommendedRF(m);
  const maxEst = Math.max(...sorted.map(s => s.est_full_bytes || 0), 1);
  const cols = sorted.map(s => {
    const h = Math.max(10, Math.round(86 * (s.est_full_bytes || 0) / maxEst));

    </div>

    <div class="rfcols">${cols.map(c => `
      <div class="rfcol ${c.isRec ? 'rec' : ''} ${c.isSel ? 'sel' : ''}" role="button" tabindex="0" aria-label="Select RF ${c.s.rf}" onclick="selectRF(${c.s.rf})">
        ${c.isRec ? '<div class="recl g-txt-fine">RECOMMENDED</div>' : ''}

        <div class="pct">${src && c.s.est_full_bytes ? Math.round(100 * c.s.est_full_bytes / src) + '%' : '?'} of source</div>
        <div class="bar ${c.isRec ? 'g-fine' : ''}" style="height:${c.h}px"></div>
      </div>`).join('')}
    </div>
    <div class="rflabels">${cols.map(c => `
      <div class="rflab ${c.isRec ? 'rec' : ''}">
        <div class="rf">RF ${c.s.rf}</div>

        <div class="lnk"><a href="/api/movies/${m.id}/samples/file?file=${encodeURIComponent(c.s.file)}" target="_blank">▶ play</a> · <span class="x" role="button" tabindex="0" aria-label="Delete this sample" onclick="delSample(${m.id},'${encodeURIComponent(c.s.file)}')">✕</span></div>
      </div>`).join('')}
    </div>
    <div class="qaxis"></div>
    <div class="qlbl"><span>← HIGHER QUALITY · BIGGER FILE</span><span>SMALLER FILE · QUALITY RISK →</span></div>`

  </div>`;
}
function selectRF(rf) { SELRF = rf; const i = document.getElementById('rfInput'); if (i) i.value = rf; refreshStep3(); }

function refreshStep3() {

async function previewCmd(id) {

async function runJob(id, kind) {
  const est = SAMPLES.find(s => s.rf === SELRF)?.est_full_bytes;

    title: kind === 'encode' ? `Heavy Encode @ RF ${SELRF}` : 'Quick Remux',
    html: kind === 'encode'
      ? `x265 10-bit re-encode — hours to days of CPU time.${est ? `<br>Projected output: <b>${fmtG(est)}</b> (source ${fmtG(window._m?.size_bytes)}).` : ''}<br>Source file is not touched; output lands next to it.`
      : 'mkvmerge repackage with your kept tracks — minutes, no quality change. Source file is not touched.',
    confirmLabel: kind === 'encode' ? 'Start encode' : 'Start remux', mode: 'plain',
  });

// ---------- job watching ----------
function jobProgressHtml() {
  const j = JOBS.find(x => x.movie_id === CURID && (x.status === 'running' || x.status === 'queued'));
  if (!j) return '';
  if (j.status === 'queued') return `<div class="jprog"><div class="row" style="color:var(--faint)">QUEUED — waiting for the runner</div></div>`;
  return `<div class="jprog">
    <div class="row">${esc(KIND_LABEL[j.kind] || j.kind).toUpperCase()} · ${(j.progress || 0).toFixed(1)}%
      ${j.eta ? `<span class="eta">ETA ${esc(j.eta.toUpperCase())}</span>` : ''}</div>
    <div class="bar" role="progressbar" aria-valuenow="${Math.round(j.progress || 0)}" aria-valuemin="0" aria-valuemax="100"><div class="g-acc" style="width:${j.progress || 0}%"></div></div></div>`;
}
function paintDetailJob() {
  if (!CURID || !window._m || !INFLIGHT.includes(window._m.status)) return;
  const el = document.getElementById('step3body');
  if (el) { const h = jobProgressHtml(); if (h) el.innerHTML = h; }
}
// Watching a job to completion is now a registry, not a poll chain: record what
// to do when a job id stops being in flight, and let the SSE stream decide when
// that happened. WATCHING is cleared on navigation, so a watcher can never fire
// against a page the user already left.
function watchJob(jobId, movieId) {
  WATCHING.set(jobId, { hash: `#/movie/${movieId}`, ownerId: movieId, base: 'movies' });
}
function watchMovieJob(id) {
  const mine = JOBS.filter(j => j.movie_id === id).sort((a, b) => b.id - a.id);
  if (mine.length) watchJob(mine[0].id, id);
}
// jobId is passed straight after enqueueing -- JOBS won't carry the new job
// until the next stream tick, so looking it up there would silently no-op
function watchEpisodeJob(id, jobId) {
  if (jobId === undefined) {
    const mine = JOBS.filter(j => j.episode_id === id).sort((a, b) => b.id - a.id);
    if (!mine.length) return;
    jobId = mine[0].id;
  }
  WATCHING.set(jobId, { hash: `#/episode/${id}`, ownerId: id, base: 'episodes' });
}
async function reapWatched() {
  for (const [jobId, w] of [...WATCHING]) {
    const j = JOBS.find(x => x.id === jobId);
    // absent means it aged out of the job window -- treat as finished, since
    // every running or queued job is always included in the payload
    if (j && (j.status === 'running' || j.status === 'queued')) continue;
    WATCHING.delete(jobId);
    if (location.hash !== w.hash) continue;
    if (w.base === 'episodes') { renderEpisode(w.ownerId); continue; }
    if (j && j.kind === 'sample') {
      SAMPLES = await api(`/api/movies/${w.ownerId}/samples`).catch(() => []);
      refreshStep3();
    } else renderDetail(w.ownerId);
  }
}

// 'done' means nothing is left to decide. A green check beside "80 differ" was
// telling the user two opposite things at once.
function cfgState(cfg) {
  if (!cfg || !Object.keys(cfg.config || {}).length) return 'active';
  return cfg.conflicts.length ? 'active' : 'done';
}
function cfgSummary(cfg) {
  if (!cfg || !Object.keys(cfg.config || {}).length) return 'apply one episode\'s track setup to the whole show';
  const n = cfg.conflicts.length;
  // the diff is over which tracks EXIST, not over your keep/drop choices --
  // say so, because "conflict" read as "your settings are broken"
  return n ? `${cfg.applicable} episodes carry the same tracks · ${n} have a different track list`
           : `all ${cfg.applicable} episodes carry the same tracks`;
}
// "111, 112, 113, …, 131" is 21 numbers of noise; "111–131" is the same fact.
function rangeList(nums) {
  const out = [];
  let i = 0;
  while (i < nums.length) {
    let j = i;
    while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
    out.push(j - i >= 2 ? `${nums[i]}–${nums[j]}` : nums.slice(i, j + 1).join(', '));
    i = j + 1;
  }
  return out.join(', ');
}
function seasonSummary(seasons) {
  const missing = seasons.seasons.reduce((n, sn) => n + sn.missing.length, 0);
  return missing || seasons.out_of_range.length ? `${missing} missing · ${seasons.out_of_range.length} out-of-range` : 'all episodes present';
}
// track_sig is "type|lang|codec|name" -- readable to the code, not to a person.
// Lead with the release's own track name, which is what the user recognises.
function sigLabel(sig) {
  const [type, lang, codec, ...rest] = String(sig).split('|');
  const name = rest.join('|').trim();
  return (name || `${codec || ''} ${type || ''}`.trim()) + (lang ? ` (${lang})` : '');
}
function showConfigHtml(showId, cfg) {
  if (!cfg) return '<div style="color:var(--faint);font-size:12px">TMDB match required</div>';
  const allConf = cfg.conflicts;
  const conflicts = (CONFSHOWALL ? allConf : allConf.slice(0, CONF_PAGE)).map(c => `
    <div class="trow stacked">
      <div class="cinfo" style="width:78px"><div class="cc">S${String(c.season||0).padStart(2,'0')}E${String(c.episode||0).padStart(2,'0')}</div></div>
      <div class="cinfo grow">
        ${c.missing.length ? `<div class="cc wrap">doesn't have: ${c.missing.map(sigLabel).map(esc).join(', ')}</div>` : ''}
        ${c.extra.length ? `<div class="cm wrap">also has: ${c.extra.map(sigLabel).map(esc).join(', ')}</div>` : ''}
        ${c.ambiguous.length ? `<div class="cm wrap">duplicated: ${c.ambiguous.map(sigLabel).map(esc).join(', ')}</div>` : ''}
      </div>
      <span class="linky" role="button" tabindex="0" onclick="location.hash='#/episode/${c.episode_id}'">configure ›</span>
    </div>`).join('');
  return `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span style="font-size:12px;color:var(--faint)">Use episode:</span>
      <input id="cfgSourceEp" type="number" aria-label="Episode number to copy the track setup from" placeholder="episode #" style="width:100px">
      <button class="btn" onclick="useEpisodeAsShowConfig(${showId})">as config for all</button>
      <button class="btn primary g-acc-lg" onclick="applyShowConfig(${showId})" ${Object.keys(cfg.config||{}).length ? '' : 'disabled'}>Apply to all (${cfg.applicable})</button>
    </div>
    ${conflicts ? `<div class="lbl" style="margin-top:12px">DIFFERENT TRACK LIST — HANDLE INDIVIDUALLY</div>${conflicts}
      ${allConf.length > CONF_PAGE ? `<div class="btnrow" style="margin-top:8px">
        <button class="btn" onclick="CONFSHOWALL=!CONFSHOWALL;renderShow(${showId})">${CONFSHOWALL ? `Collapse to first ${CONF_PAGE}` : `Show all ${allConf.length}`}</button>
        <span style="align-self:center;font:11px var(--mono);color:var(--faint)">${CONFSHOWALL ? allConf.length : CONF_PAGE} of ${allConf.length} shown</span>
      </div>` : ''}` : ''}`;
}

function seasonHtml(showId, s, seasons) {
  if (!seasons) return '<div style="color:var(--faint);font-size:12px">TMDB match required</div>';
  const rows = seasons.seasons.map(sn => `

      <div class="cm wrap">${sn.missing.length ? 'missing: ' + esc(rangeList(sn.missing)) : 'complete'}</div></div></div>`).join('');

    ${blocked ? `<div style="color:var(--err);font-size:12px;margin-top:8px">out of TMDB's range, resolve before renaming: ${seasons.out_of_range.map(o => `S${String(o.season).padStart(2,'0')}E${String(o.episode).padStart(2,'0')}`).join(', ')}</div>` : ''}
    <div class="btnrow"><button class="btn primary g-acc-lg" onclick="renameShow(${showId}, '${esc(s.title)}')" ${blocked ? 'disabled' : ''}>Rename for Jellyfin</button></div>`;

// Longest shared leading run across all filenames. After a rename every episode
// starts with "Show (Year) - S01E", so a fixed-width column rendered the exact
// same truncated string on all 110 rows -- the distinguishing tail was the part
// being cut off. Strip the shared head and show what actually differs.
function commonPrefix(list) {
  if (list.length < 2) return '';
  let p = list[0] || '';
  for (const s of list) {
    let i = 0;
    while (i < p.length && i < s.length && p[i] === s[i]) i++;
    p = p.slice(0, i);
    if (!p) break;
  }
  return p;
}
let EPSHOWALL = false, CONFSHOWALL = false;
const EP_PAGE = 24, CONF_PAGE = 10;
// A 105-episode batch is one decision, so it needs one place to watch it and one
// place to stop it -- the dashboard strip only ever shows the single running job.
function showJobsHtml(data) {
  const ids = new Set(data.episodes.map(e => e.id));
  const mine = JOBS.filter(j => ids.has(j.episode_id) && (j.status === 'running' || j.status === 'queued'));
  const run = mine.find(j => j.status === 'running');
  const queued = mine.filter(j => j.status === 'queued').length;
  if (!mine.length) return '';
  const ep = run && data.episodes.find(e => e.id === run.episode_id);
  const label = ep ? `S${String(ep.season||0).padStart(2,'0')}E${String(ep.episode||0).padStart(2,'0')}` : '';
  return `<div class="trow stacked" style="border-color:var(--accBd)">
    <div class="cinfo grow">
      <div class="cc">${run ? `${esc(run.kind.toUpperCase())} ${esc(label)} · ${(run.progress||0).toFixed(0)}%${run.eta ? ' · ETA ' + esc(run.eta) : ''}` : 'waiting for the runner'}</div>
      <div class="jobbar" role="progressbar" aria-valuenow="${Math.round(run ? run.progress||0 : 0)}" aria-valuemin="0" aria-valuemax="100" aria-label="Batch job progress"><div class="g-acc" style="width:${run ? run.progress||0 : 0}%"></div></div>
      <div class="cm">${queued} queued after this one</div>
    </div>
    <div class="btnrow" style="margin:0">
      ${run ? `<button class="btn danger" onclick="cancelJob(${run.id})">Cancel this</button>` : ''}
      <button class="btn danger" onclick="cancelShowJobs(${data.show.id})">Cancel all ${mine.length}</button>
    </div></div>`;
}
async function cancelJob(jobId) {
  const ok = await modal({ title: 'Cancel this job', danger: true, mode: 'plain', confirmLabel: 'Cancel job',
    html: 'Stops the running job and deletes its partial output. The episode goes back to ready — the next queued job starts immediately.' });
  if (!ok) return;
  await api(`/api/jobs/${jobId}`, { method: 'DELETE' }).catch(oops);
  // don't wait for the next stream tick to redraw the page the user is looking at
  JOBS = await api('/api/jobs').catch(() => JOBS);
  if (location.hash.startsWith('#/show/') && SHOWDATA) renderShow(SHOWDATA.show.id);
}
async function cancelShowJobs(showId) {
  const ok = await modal({ title: 'Cancel the whole batch', danger: true, mode: 'plain', confirmLabel: 'Cancel all',
    html: 'Drops every queued job for this show and stops the one running. Episodes already finished keep their output.' });
  if (!ok) return;
  const r = await api(`/api/shows/${showId}/jobs/cancel`, { method: 'POST' }).catch(oops);
  if (r) toast(`${r.cancelled} job(s) cancelled.`);
  renderShow(showId);
}
function episodesHtml(data) {
  const all = data.episodes;
  const prefix = commonPrefix(all.map(e => e.file || ''));
  const shown = EPSHOWALL ? all : all.slice(0, EP_PAGE);
  const rows = shown.map(e => {
    const running = INFLIGHT.includes(e.status);
    const job = JOBS.find(j => j.episode_id === e.id && (j.status === 'running' || j.status === 'queued'));
    const tail = (e.file || '').slice(prefix.length) || (e.file || '');
    const spec = [resOf(e) || null, (e.video_codec || '').toUpperCase() || null,
                  fmtG(e.size_bytes) || null].filter(Boolean).join(' · ');
    const col = (job || running) ? 'var(--acc)' : e.status === 'clean' ? 'var(--fine)'
              : e.status === 'error' ? 'var(--err)' : 'var(--faint)';
    return `<div class="trow ${e.excluded ? 'drop' : ''}">
      <button class="keep-pill ${e.excluded ? 'off' : 'on'}" aria-pressed="${e.excluded ? 'false' : 'true'}" onclick="toggleExcluded(${data.show.id},${e.id})">${e.excluded ? 'EXCLUDED' : 'INCLUDED'}</button>
      <div class="cinfo" style="width:78px"><div class="cc">S${String(e.season||0).padStart(2,'0')}E${String(e.episode||0).padStart(2,'0')}</div></div>
      <div class="cinfo grow" title="${esc(e.file || '')}"><div class="cc">${esc(tail)}</div><div class="cm">${esc(spec)}</div></div>
      <span style="font:10px var(--mono);color:${col}">${job ? (job.status.toUpperCase() + ' ' + (job.progress||0).toFixed(0) + '%') : e.status.toUpperCase()}</span>
      <span class="linky" role="button" tabindex="0" onclick="location.hash='#/episode/${e.id}'">configure ›</span>
    </div>`;
  }).join('');
  const more = all.length > EP_PAGE ? `<div class="btnrow" style="margin-top:8px">
      <button class="btn" onclick="EPSHOWALL=!EPSHOWALL;renderShow(${data.show.id})">${EPSHOWALL ? `Collapse to first ${EP_PAGE}` : `Show all ${all.length} episodes`}</button>
      <span style="align-self:center;font:11px var(--mono);color:var(--faint)">${EPSHOWALL ? all.length : EP_PAGE} of ${all.length} shown</span>
    </div>` : '';
  return `<div id="showJobPanel">${showJobsHtml(data)}</div>
    ${rows || '<div style="color:var(--faint);font-size:12px">no episodes found</div>'}
    ${more}
    <div class="btnrow">
      <button class="btn" onclick="suggestShow(${data.show.id})">Suggest all (non-excluded)</button>
      <button class="btn ghost2" onclick="runShowJob(${data.show.id},'remux')">Remux all configured</button>
      <button class="btn gold" onclick="runShowJob(${data.show.id},'encode')">Encode all configured</button>
    </div>`;
}
async function toggleExcluded(showId, epId) {
  // PUT takes the full excluded set (not a diff) -- flip epId's own flag, keep every other episode's as-is
  const excludedIds = SHOWDATA.episodes.filter(e => e.id === epId ? !e.excluded : e.excluded).map(e => e.id);
  await api(`/api/shows/${showId}/episodes`, { method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ excluded: excludedIds }) }).catch(oops);
  renderShow(showId);
}

    body: JSON.stringify({ kind, quality: 22 }) }).catch(e => { oops(e); throw e; });
  toast(`${r.count} job(s) enqueued.`);

  const results = await api(`/api/tmdb/search?q=${encodeURIComponent(q)}&kind=tv`).catch(e => { oops(e); return []; });
  document.getElementById('showTmdbResults').innerHTML = results.map(r => `
    <div class="cand" role="button" tabindex="0" onclick="pickTmdbShow(${id}, ${r.tmdb_id})">
      ${r.poster_path ? `<img src="${posterUrl(r.poster_path)}" alt="" width="40" height="60" loading="lazy">` : ''}
      <span>${esc(r.title)} (${r.year || '?'}) <span class="cl">${esc(r.original_language || '')}</span></span>
    </div>`).join('') || '<div class="empty" style="padding:14px">NO RESULTS</div>';
}
async function pickTmdbShow(id, tmdbId) {
  await api(`/api/shows/${id}/tmdb`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ tmdb_id: tmdbId }) }).catch(oops);
  renderShow(id);
}

// ---------- episode detail (reuses the movie track editor via TRACK_BASE/TRACK_ID) ----------
async function renderEpisode(id) {
  const page = document.getElementById('page');
  page.innerHTML = '<div class="dwrap"><div class="skel" style="height:60px;margin:20px 22px"></div><div class="skel" style="height:180px;margin:20px 22px"></div></div>';
  const data = await api(`/api/episodes/${id}`).catch(e => { page.innerHTML = `<div class="empty">${esc(e.message)}</div>`; throw e; });
  const e = data.episode;
  TRACK_BASE = 'episodes'; TRACK_ID = id;
  TRACKSTATE = {
    audio: data.tracks.filter(t => t.type === 'audio').map(t => ({ ...t })),
    subs: data.tracks.filter(t => t.type === 'subtitle').map(t => ({ ...t })),
  };
  VIDEOTRACK = data.tracks.find(t => t.type === 'video');
  const show = e.show;
  const title = `${(show && (show.title || show.clean_title)) || 'Show'} - S${String(e.season||0).padStart(2,'0')}E${String(e.episode||0).padStart(2,'0')}`;
  const running = INFLIGHT.includes(e.status);
  const backHash = show ? `#/show/${show.id}` : '';

  page.innerHTML = `<div class="dwrap">
    <div class="dtop"><span class="back" role="button" tabindex="0" onclick="location.hash='${backHash}'">← ${esc((show && (show.title || show.clean_title)) || 'Show')}</span></div>
    <div class="ident">
      <div style="min-width:0">
        <h1>${esc(title)}</h1>
        <div class="fn">${esc(e.file || e.folder)}</div>
      </div>
    </div>
    <div class="steps">
      ${stepCard(1, 'active', 'Configure tracks',
        `${TRACKSTATE.audio.length + TRACKSTATE.subs.length + 1} tracks → ${1 + [...TRACKSTATE.audio, ...TRACKSTATE.subs].filter(t => t.keep).length} kept`,
        null, `<div id="tracksbox">${tracksHtml(VIDEOTRACK)}</div>`)}
      ${stepCard(2, running ? 'active' : e.status === 'clean' ? 'done' : 'active', 'Process',
        running ? 'job running…' : e.status === 'clean' ? 'output verified' : 'pick a route',
        null, `<div id="epJobBody">${episodeJobHtml(e, running)}</div>`)}
      ${e.status === 'clean' ? stepCard(3, 'active', 'Finalize', 'delete original source file', null, `
        <div class="btnrow" style="margin:0"><button class="btn danger" onclick="deleteOriginalEpisode(${id})">Delete original</button></div>`) : ''}
    </div></div>`;
  wireStepToggles();
  window._ep = e;
  if (running) watchEpisodeJob(id);
}
function episodeJobHtml(e, running) {
  if (running) {
    const j = JOBS.find(x => x.episode_id === e.id && (x.status === 'running' || x.status === 'queued'));
    if (j && j.status === 'queued') return `<div class="jprog"><div class="row" style="color:var(--faint)">QUEUED — waiting for the runner</div></div>`;
    if (j) return `<div class="jprog"><div class="row">${esc(KIND_LABEL[j.kind] || j.kind).toUpperCase()} · ${(j.progress || 0).toFixed(1)}%</div>
      <div class="bar" role="progressbar" aria-valuenow="${Math.round(j.progress || 0)}" aria-valuemin="0" aria-valuemax="100"><div class="g-acc" style="width:${j.progress || 0}%"></div></div></div>`;
    return '<div class="jprog"><div class="row">job starting…</div></div>';
  }
  return `<div class="btnrow" style="margin-top:0">
    <button class="btn gold" onclick="runEpisodeJob(${e.id},'encode')">Heavy Encode</button>
    <button class="btn ghost2" onclick="runEpisodeJob(${e.id},'remux')">Quick Remux</button>
  </div>`;
}
async function runEpisodeJob(id, kind) {
  const ok = await modal({
    title: kind === 'encode' ? 'Heavy Encode' : 'Quick Remux',
    html: kind === 'encode' ? 'x265 10-bit re-encode. Source file is not touched; output lands next to it.'
                            : 'mkvmerge repackage with your kept tracks — minutes, no quality change.',
    confirmLabel: kind === 'encode' ? 'Start encode' : 'Start remux', mode: 'plain',
  });
  if (!ok) return;
  const r = await api(`/api/episodes/${id}/jobs`, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ kind, quality: 22 }) }).catch(e => { oops(e); throw e; });
  renderEpisode(id);
  watchEpisodeJob(id, r.job_id);
}
async function deleteOriginalEpisode(id) {
  const ok = await modal({
    title: 'Delete original', danger: true, mode: 'hold', confirmLabel: 'Hold to delete',
    html: 'Permanently deletes the original source file, keeping the verified job output. This cannot be undone.',
  });
  if (!ok) return;
  await api(`/api/episodes/${id}/delete-original`, { method: 'POST' }).catch(oops);
  renderEpisode(id);
}
</script>
